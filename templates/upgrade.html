<!-- templates/upgrade.html -->
{% extends "layout.html" %}
{% block content %}

<h2 class="mb-4">Upgrade to Premium</h2>

<div class="card shadow-sm p-4">

    <p>
        Becoming a <strong>Premium</strong> member unlocks:
    </p>

    <ul>
        <li>Exclusive Premium-Only Books</li>
        <li>Early Access to New Releases</li>
        <li>Priority Recommendations</li>
        <li>Unlimited Reading</li>
    </ul>

    <h4 class="mt-4">Price: <strong>$9.99</strong></h4>

    <form method="POST" class="mt-4">
        <button class="btn btn-success w-100 py-2">
            Confirm Upgrade
        </button>
    </form>

    <a href="{{ url_for('ui.profile') }}" class="btn btn-outline-secondary w-100 mt-3">
        Back to Profile
    </a>

</div>

{% endblock %}
