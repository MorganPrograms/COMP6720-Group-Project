<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ book.title }} – Book Details</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #fafafa; }
    .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ddd; }
    h1 { margin-bottom: 5px; }
    .meta { color: #555; margin-bottom: 20px; }
    .desc { margin-bottom: 20px; }
    .actions { display: flex; gap: 20px; margin-top: 25px; }
    form { display: inline-block; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #0056b3; }
    select, input[type="number"] { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }
    .rating { margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>{{ book.title }}</h1>
    <div class="meta">
      <strong>Author:</strong> {{ book.author }}<br>
      <strong>Genre:</strong> {{ book.genre }}<br>
      <strong>Published:</strong> {{ book.details.publication_date }}
    </div>

    <div class="desc">
      <p>{{ book.description }}</p>
    </div>

    <hr>

    <div class="rating">
      <h3>Rate this Book</h3>
      <form action="{{ url_for('rate_book', book_id=book._id) }}" method="POST">
        <label for="rating">Your Rating:</label>
        <input type="number" id="rating" name="rating" min="1" max="5" step="0.5" value="{{ user_rating or '' }}" required>
        <button type="submit">Submit Rating</button>
      </form>
    </div>

    <div class="actions">
      <form action="{{ url_for('subscribe_book', book_id=book._id) }}" method="POST">
        <button type="submit">Subscribe</button>
      </form>
      <a href="{{ url_for('read_book', book_id=book._id) }}">
        <button type="button">Read Book</button>
      </a>
    </div>
  </div>

</body>
</html>
