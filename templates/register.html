

<head>
  <title>Register - eBook Portal</title>

</head>
<body>
  <h2>Register</h2>

<style>
.hidden {
    display: none;
}
form {
    max-width: 400px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
}
label {
    display: block;
    margin-top: 10px;
}
input, select, textarea, button {
    width: 100%;
    padding: 8px;
    margin-top: 3px;
}
</style>



  <form action="/register" method="post" id="registerForm" >
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <label for="tier">Subscription Tier:</label>
      <select id="tier" name="tier" required>
        <option value="Free">Free</option>
        <option value="Premium">Premium</option>
      </select>
 <!-- Advanced Account Fields -->
    <div id="advancedFields" class="hidden">

        <h3>Payment Details</h3>

        <label>Payment Method:</label>
        <select id="paymentMethod" name="paymentMethod">
            <option value="">-- Select --</option>
            <option value="debit">Debit Card</option>
            <option value="credit">Credit Card</option>
        </select>

        <label>Card Number:</label>
            <input type="text" name="card_number" placeholder="1234 5678 9012 3456" required>

            <label>Expiry Date</label>
            <input type="text" name="expiry" placeholder="MM/YY" required>

            <label>CVV</label>
            <input type="text" name="cvv" placeholder="123" required>

            <button type="submit" class="btn">Confirm Upgrade</button>
    </div>

    
    
    <button type="submit">Register</button>
  </form>
</body>

<script>
// Toggle visibility when selecting account type
document.getElementById("tier").addEventListener("change", function () {
    const isAdvanced = this.value === "Premium";
    const advancedFields = document.getElementById("advancedFields");

    if (isAdvanced) {
        advancedFields.classList.remove("hidden");
    } else {
        advancedFields.classList.add("hidden");
    }
});
</script>
